<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BusPaszt</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="app" class="frame">
      <div id="header">
	<div style="width: 10%"></div>
	<p class="outside-text">Your Ticket</p>
	<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 24 24" xml:space="preserve">
	  <g>
	    <path d="M12,2C6.5,2,2,6.5,2,12s4.5,10,10,10s10-4.5,10-10S17.5,2,12,2z M12,20c-4.5,0-8-3.5-8-8s3.5-8,8-8s8,3.5,8,8
		     S16.5,20,12,20z"/>
	    <polygon points="15.5,7.1 12,10.6 8.5,7.1 7.1,8.5 10.6,12 7.1,15.5 8.5,16.9 12,13.4 15.5,16.9 16.9,15.5 13.4,12 16.9,8.5 "/>
	  </g>
	  <rect style="fill: none;" width="24" height="24"/>
	</svg>
      </div>
      <div id="main">
	<div id="price-box" class="frame">
	  <p class="outside-text">1 Adult</p>
	  <p class="outside-text">£6.00</p>
	</div>
	<img src="./images/qr-code.png">
	<p id="ticket-title">Bay DayRider</p>
	<p class="ticket-info">Valid from: 00:00, 28 May 2026</p>
	<div id="ticket-expire" class="ticket-info">
	  <p>Ticket expires in</p>
	  <p>23h : 59m : 33s</p>
	</div>
	<div id="code-box" class="ticket-info">3443-20260528081346769-YBeJV</div>
	<div id="details-txt">
	  <p>More details</p>
	</div>
      </div>
      <div id="gyro-box">
	<canvas id="gyro-canvas"></canvas>
	<p id="gyro-text">Boots</p>
	<p id="gyro-time"></p>
      </div>
    </div>
    <script src="sample.js"></script>
    <!-- <script src="script.js"></script>  -->
    <script src="render.js"></script>
  </body>
</html>
